<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-2048">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">2048</div>
            <div class="pill">★ <strong id="score">0</strong></div>
            <div class="quiet">Best <strong id="best">0</strong></div>
        </header>
        <section class="shell">
            <div class="shell-tools">
                <button id="restart" class="orb" type="button" aria-label="New game">↺</button>
            </div>
            <div class="play">
                <p id="status" class="bubble">Arrow keys or swipe to slide.</p>
                <div class="stage"><div id="board"></div></div>
            </div>
            <p class="caption">Same numbers merge once</p>
            <div class="dpad">
                <button type="button" data-dir="up">Up</button>
                <div class="row">
                    <button type="button" data-dir="left">Left</button>
                    <button type="button" data-dir="down">Down</button>
                    <button type="button" data-dir="right">Right</button>
                </div>
            </div>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
