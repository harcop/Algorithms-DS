<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-2048">
    <main class="app">
        <a class="back" href="../index.html">← Games</a>
        <header class="title-row">
            <div>
                <p class="kicker">Puzzle</p>
                <h1>2048</h1>
            </div>
            <div class="hud">
                <div class="stat"><span>Score</span><strong id="score">0</strong></div>
                <div class="stat"><span>Best</span><strong id="best">0</strong></div>
            </div>
        </header>
        <div class="toolbar">
            <p id="status" class="status">Arrow keys or swipe to slide.</p>
            <button id="restart" class="btn" type="button">New game</button>
        </div>
        <div class="stage"><div id="board"></div></div>
        <div class="dpad">
            <button type="button" data-dir="up">Up</button>
            <div class="row">
                <button type="button" data-dir="left">Left</button>
                <button type="button" data-dir="down">Down</button>
                <button type="button" data-dir="right">Right</button>
            </div>
        </div>
        <p class="help">Tiles with the same number merge once per move. A new tile appears after every real move.</p>
    </main>
    <script src="./index.js"></script>
</body>
</html>
