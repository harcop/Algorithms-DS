<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex 2048</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-hex">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">Hex 2048</div>
            <div class="pill">★ <strong id="score">0</strong></div>
            <div class="quiet">Best <strong id="best">0</strong></div>
        </header>
        <section class="shell">
            <div class="shell-tools">
                <button id="restart" class="orb" type="button" aria-label="New game">↺</button>
            </div>
            <div class="play">
                <p id="status" class="bubble">Slide in any of the six directions.</p>
                <div class="stage"><canvas id="board" width="520" height="460"></canvas></div>
            </div>
            <p class="caption">Drag, or use the six directions</p>
            <div class="hexpad">
                <button type="button" data-dir="NW">NW Q</button>
                <button type="button" data-dir="NE">NE W</button>
                <button type="button" data-dir="W">W A</button>
                <button type="button" data-dir="E">E D</button>
                <button type="button" data-dir="SW">SW Z</button>
                <button type="button" data-dir="SE">SE X</button>
            </div>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
