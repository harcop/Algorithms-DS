<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex 2048</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-hex">
    <main class="app">
        <a class="back" href="../index.html">← Games</a>
        <header class="title-row">
            <div>
                <p class="kicker">Puzzle</p>
                <h1>Hex 2048</h1>
            </div>
            <div class="hud">
                <div class="stat"><span>Score</span><strong id="score">0</strong></div>
                <div class="stat"><span>Best</span><strong id="best">0</strong></div>
            </div>
        </header>
        <div class="toolbar">
            <p id="status" class="status">Slide in any of the six directions.</p>
            <button id="restart" class="btn" type="button">New game</button>
        </div>
        <div class="stage"><canvas id="board" width="520" height="460"></canvas></div>
        <div class="hexpad">
            <button type="button" data-dir="NW">NW <kbd>Q</kbd></button>
            <button type="button" data-dir="NE">NE <kbd>W</kbd></button>
            <button type="button" data-dir="W">W <kbd>A</kbd></button>
            <button type="button" data-dir="E">E <kbd>D</kbd></button>
            <button type="button" data-dir="SW">SW <kbd>Z</kbd></button>
            <button type="button" data-dir="SE">SE <kbd>X</kbd></button>
        </div>
        <p class="help">Arrow keys cover west, east, northeast, and southeast. You can also drag across the board.</p>
    </main>
    <script src="./index.js"></script>
</body>
</html>
