<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-mine">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">Mines</div>
            <div class="quiet">Left <strong id="bombs">10</strong></div>
        </header>
        <section class="shell">
            <div class="shell-tools">
                <button id="face" class="orb" type="button" aria-label="New game">🙂</button>
            </div>
            <div class="play">
                <p id="status" class="bubble">Left click opens a cell. Right click, or Flag mode, marks a bomb. The first click is always safe.</p>
                <div class="stage"><div id="grid"></div></div>
            </div>
            <p class="caption">Ten bombs. Open every safe cell.</p>
            <div class="actions">
                <button id="flagMode" class="btn ghost" type="button">Flag mode</button>
            </div>
        </section>
    </main>
    <script>
        var SIZE = 10;
        var BOMBS = 10;
        var grid = [];
        var started = false;
        var over = false;
        var won = false;
        var flagMode = false;
        var revealedCount = 0;
        var buttons = [];
        var gridEl = document.getElementById('grid');
        var bombEl = document.getElementById('bombs');
        var statusEl = document.getElementById('status');
        var faceEl = document.getElementById('face');
        var flagBtn = document.getElementById('flagMode');

        function neighbors(x, y) {
            var out = [];
            for (var dy = -1; dy <= 1; dy++) {
                for (var dx = -1; dx <= 1; dx++) {
                    if (!dx && !dy) continue;
                    var nx = x + dx;
                    var ny = y + dy;
                    if (nx >= 0 && ny >= 0 && nx < SIZE && ny < SIZE) out.push(grid[ny][nx]);
                }
            }
            return out;
        }

        function placeBombs(sx, sy) {
            var banned = {};
            banned[sy * SIZE + sx] = true;
            neighbors(sx, sy).forEach(function (cell) {
                banned[cell.y * SIZE + cell.x] = true;
            });
            var placed = 0;
            while (placed < BOMBS) {
                var i = Math.floor(Math.random() * SIZE * SIZE);
                if (banned[i]) continue;
                var x = i % SIZE;
                var y = Math.floor(i / SIZE);
                if (grid[y][x].bomb) continue;
                grid[y][x].bomb = true;
                placed++;
            }
            for (var y = 0; y < SIZE; y++) {
                for (var x = 0; x < SIZE; x++) {
                    if (grid[y][x].bomb) continue;
                    grid[y][x].count = neighbors(x, y).filter(function (cell) { return cell.bomb; }).length;
                }
            }
        }

        function flood(x, y) {
            var stack = [[x, y]];
            while (stack.length) {
                var pair = stack.pop();
                var cell = grid[pair[1]][pair[0]];
                if (cell.revealed || cell.flagged || cell.bomb) continue;
                cell.revealed = true;
                revealedCount++;
                if (cell.count === 0) {
                    neighbors(cell.x, cell.y).forEach(function (n) {
                        if (!n.revealed && !n.flagged && !n.bomb) stack.push([n.x, n.y]);
                    });
                }
            }
        }

        function render() {
            var flags = 0;
            for (var y = 0; y < SIZE; y++) {
                for (var x = 0; x < SIZE; x++) {
                    var cell = grid[y][x];
                    var el = buttons[y * SIZE + x];
                    if (cell.flagged) flags++;
                    el.className = 'cell';
                    el.textContent = '';
                    el.removeAttribute('data-n');
                    if (cell.revealed) {
                        el.classList.add('open');
                        if (cell.bomb) {
                            el.classList.add('boom');
                            el.textContent = '●';
                        } else if (cell.count > 0) {
                            el.textContent = String(cell.count);
                            el.dataset.n = String(cell.count);
                        }
                    } else if (cell.flagged) {
                        el.classList.add('flag');
                        el.textContent = '⚑';
                    } else if (over && cell.bomb) {
                        el.classList.add('open', 'mine');
                        el.textContent = '●';
                    }
                }
            }
            bombEl.textContent = String(BOMBS - flags);
            faceEl.textContent = won ? '😎' : over ? '😵' : '🙂';
        }

        function finish(message, didWin) {
            over = !didWin;
            won = didWin;
            statusEl.textContent = message;
            render();
        }

        function openCell(x, y) {
            if (over || won) return;
            if (!started) {
                placeBombs(x, y);
                started = true;
            }
            var cell = grid[y][x];
            if (cell.revealed || cell.flagged) return;
            if (cell.bomb) {
                cell.revealed = true;
                finish('Game over.', false);
                return;
            }
            flood(x, y);
            if (revealedCount === SIZE * SIZE - BOMBS) finish('You cleared the field.', true);
            else render();
        }

        function toggleFlag(x, y) {
            if (over || won || !started) return;
            var cell = grid[y][x];
            if (cell.revealed) return;
            cell.flagged = !cell.flagged;
            render();
        }

        function fresh() {
            grid = [];
            buttons = [];
            gridEl.innerHTML = '';
            started = false;
            over = false;
            won = false;
            revealedCount = 0;
            statusEl.textContent = 'Left click opens a cell. Right click, or Flag mode, marks a bomb. The first click is always safe.';
            for (var y = 0; y < SIZE; y++) {
                grid[y] = [];
                for (var x = 0; x < SIZE; x++) {
                    grid[y][x] = { x: x, y: y, bomb: false, count: 0, revealed: false, flagged: false };
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'cell';
                    (function (cx, cy, el) {
                        el.addEventListener('click', function () {
                            if (flagMode && started) toggleFlag(cx, cy);
                            else openCell(cx, cy);
                        });
                        el.addEventListener('contextmenu', function (event) {
                            event.preventDefault();
                            toggleFlag(cx, cy);
                        });
                    })(x, y, button);
                    gridEl.appendChild(button);
                    buttons.push(button);
                }
            }
            render();
        }

        flagBtn.addEventListener('click', function () {
            flagMode = !flagMode;
            flagBtn.classList.toggle('on', flagMode);
            flagBtn.textContent = flagMode ? 'Flag mode on' : 'Flag mode';
        });
        faceEl.addEventListener('click', fresh);
        fresh();
    </script>
</body>
</html>
