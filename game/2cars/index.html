<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Cars</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-cars">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">2 Cars</div>
            <div class="pill">★ <strong id="score">0</strong></div>
        </header>
        <section class="shell">
            <div class="shell-tools">
                <button id="restart" class="orb" type="button" aria-label="Restart">↺</button>
            </div>
            <div class="play">
                <p id="status" class="bubble">Collect the gold boxes. Avoid the red cars.</p>
                <div class="stage"><canvas id="board" width="420" height="560"></canvas></div>
            </div>
            <p class="caption">Left car uses ←. Right car uses →.</p>
            <div class="controls">
                <button id="switchLeft" type="button">Switch left</button>
                <button id="switchRight" type="button">Switch right</button>
            </div>
        </section>
    </main>
    <script src="./cars.js"></script>
</body>
</html>
