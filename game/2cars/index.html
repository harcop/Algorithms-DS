<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Cars</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-cars">
    <main class="app">
        <a class="back" href="../index.html">← Games</a>
        <header class="title-row">
            <div>
                <p class="kicker">Arcade</p>
                <h1>2 Cars</h1>
            </div>
            <div class="hud">
                <div class="stat"><span>Score</span><strong id="score">0</strong></div>
                <button id="restart" class="btn" type="button">Restart</button>
            </div>
        </header>
        <p id="status" class="status">Collect the gold boxes. Avoid the red cars.</p>
        <div class="stage"><canvas id="board" width="420" height="560"></canvas></div>
        <div class="controls">
            <button id="switchLeft" type="button">Switch left</button>
            <button id="switchRight" type="button">Switch right</button>
        </div>
        <p class="help">Left arrow switches the blue car. Right arrow switches the purple car. Every gold box has to be collected.</p>
    </main>
    <script src="./cars.js"></script>
</body>
</html>
