<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min path sum</title>
    <style>
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
        a { color: #7dd3fc; }
        h1 { margin: 8px 0; }
        .bar, .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        button {
            font: inherit;
            font-weight: 700;
            border: 0;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            padding: 8px 12px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.45; cursor: default; }
        #status { min-height: 2.8em; color: #cbd5e1; }
        #grid {
            display: grid;
            grid-template-columns: repeat(4, 72px);
            gap: 8px;
            margin: 12px 0;
        }
        .cell {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #1e293b;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .cell.path { background: #0369a1; }
        .cell.current { box-shadow: inset 0 0 0 3px #f8fafc; }
        .cell.best { box-shadow: inset 0 0 0 3px #facc15; }
        .help { color: #94a3b8; }
    </style>
</head>
<body>
    <main>
        <p><a href="../index.html">All games</a></p>
        <div class="bar">
            <h1>Min path sum</h1>
            <strong>Sum <span id="sum">0</span></strong>
        </div>
        <p id="status"></p>
        <div id="grid"></div>
        <div class="controls">
            <button id="right" type="button">Right</button>
            <button id="down" type="button">Down</button>
            <button id="undo" type="button">Undo</button>
            <button id="best" type="button">Show best path</button>
            <button id="restart" type="button">New board</button>
        </div>
        <p class="help">Start at the top left. Move only right or down. Left and up undo the last step. Match the best sum at the bottom right.</p>
    </main>
    <script src="./mps_game.js"></script>
</body>
</html>
