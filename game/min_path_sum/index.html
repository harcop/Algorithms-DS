<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min path sum</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-path">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">Min path</div>
            <div class="pill">Σ <strong id="sum">0</strong></div>
        </header>
        <section class="shell">
            <div class="play">
                <p id="status" class="bubble"></p>
                <div class="stage"><div id="grid"></div></div>
            </div>
            <p class="caption">Only right or down. Match the best sum.</p>
            <div class="controls">
                <button id="right" class="btn" type="button">Right</button>
                <button id="down" class="btn" type="button">Down</button>
                <button id="undo" class="btn ghost" type="button">Undo</button>
                <button id="best" class="btn ghost" type="button">Show best</button>
                <button id="restart" class="btn ghost" type="button">New board</button>
            </div>
        </section>
    </main>
    <script src="./mps_game.js"></script>
</body>
</html>
