<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-sudoku">
    <main class="app">
        <a class="back" href="../index.html">← Games</a>
        <header class="title-row">
            <div>
                <p class="kicker">Puzzle</p>
                <h1>Sudoku</h1>
            </div>
            <button id="restart" class="btn" type="button">New puzzle</button>
        </header>
        <p id="status" class="status">Building a puzzle…</p>
        <div class="stage"><div id="grid"></div></div>
        <div id="pad"></div>
        <p class="help">Select a cell, then type a digit. Shaded numbers are clues. Conflicts turn red.</p>
    </main>
    <script src="./index.js"></script>
</body>
</html>
