<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
        a { color: #0369a1; }
        h1 { margin: 8px 0; }
        .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            padding: 8px 12px;
        }
        #status { min-height: 2.6em; color: #475569; }
        #grid {
            display: grid;
            grid-template-columns: repeat(9, 44px);
            border-top: 2px solid #0f172a;
            border-left: 2px solid #0f172a;
            width: max-content;
            margin: 12px 0;
            user-select: none;
        }
        button.cell {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 0;
            border-top: 0;
            border-left: 0;
            border-right: 1px solid #94a3b8;
            border-bottom: 1px solid #94a3b8;
            background: white;
            color: #0369a1;
            font: 700 20px/1 ui-sans-serif, system-ui, sans-serif;
        }
        button.cell:nth-child(3n) { border-right: 2px solid #0f172a; }
        button.cell:nth-child(n+19):nth-child(-n+27),
        button.cell:nth-child(n+46):nth-child(-n+54),
        button.cell:nth-child(n+73):nth-child(-n+81) { border-bottom: 2px solid #0f172a; }
        button.cell.given { color: #0f172a; background: #e2e8f0; }
        button.cell.peer { background: #e0f2fe; }
        button.cell.given.peer { background: #cbd5e1; }
        button.cell.same { background: #bae6fd; }
        button.cell.selected { box-shadow: inset 0 0 0 3px #0284c7; position: relative; z-index: 1; }
        button.cell.conflict { background: #fecaca; color: #b91c1c; }
        #pad { display: flex; flex-wrap: wrap; gap: 6px; max-width: 396px; }
        #pad button { width: 40px; height: 40px; padding: 0; background: #e2e8f0; color: #0f172a; }
        #pad button.wide { width: auto; padding: 0 12px; }
        .help { color: #64748b; }
    </style>
</head>
<body>
    <main>
        <p><a href="../index.html">All games</a></p>
        <div class="bar">
            <h1>Sudoku</h1>
            <button id="restart" type="button">New puzzle</button>
        </div>
        <p id="status">Building a puzzle…</p>
        <div id="grid"></div>
        <div id="pad"></div>
        <p class="help">Select a cell, then type a digit. Shaded numbers are clues. Conflicts turn red.</p>
    </main>
    <script src="./index.js"></script>
</body>
</html>
