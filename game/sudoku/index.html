<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-sudoku">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">Sudoku</div>
        </header>
        <section class="shell">
            <div class="shell-tools">
                <button id="restart" class="orb" type="button" aria-label="New puzzle">↺</button>
            </div>
            <div class="play">
                <p id="status" class="bubble">Building a puzzle…</p>
                <div class="stage"><div id="grid"></div></div>
            </div>
            <div id="pad"></div>
            <p class="caption">Each row, column, and box uses 1–9 once</p>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
