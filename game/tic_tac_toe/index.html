<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-ttt">
    <main class="app">
        <a class="back" href="../index.html">← Games</a>
        <header class="title-row">
            <div>
                <p class="kicker">Duel</p>
                <h1>Tic-tac-toe</h1>
            </div>
            <button id="restart" class="btn" type="button">New game</button>
        </header>
        <p id="status" class="status">Your turn. You are O.</p>
        <div id="board"></div>
        <p class="help">Click a square. The computer answers as X.</p>
    </main>
    <script src="./index.js"></script>
</body>
</html>
