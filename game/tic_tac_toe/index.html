<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-ttt">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">Tic-tac-toe</div>
        </header>
        <section class="shell">
            <div class="shell-tools">
                <button id="restart" class="orb" type="button" aria-label="New game">↺</button>
            </div>
            <div class="play">
                <p id="status" class="bubble">Your turn. You are O.</p>
                <div id="board"></div>
            </div>
            <p class="caption">You are O. The computer is X.</p>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
