<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-snake">
    <main class="app">
        <a class="back" href="../index.html">← Games</a>
        <header class="title-row">
            <div>
                <p class="kicker">Arcade</p>
                <h1>Snake</h1>
            </div>
            <div class="hud">
                <div class="stat"><span>Score</span><strong id="score">0</strong></div>
                <button id="restart" class="btn" type="button">Restart</button>
            </div>
        </header>
        <p id="status" class="status">Arrow keys to turn.</p>
        <div class="stage"><canvas id="board" width="400" height="400"></canvas></div>
        <p class="help">Eat the red food. Hitting a wall or your tail ends the run.</p>
    </main>
    <script src="./snake.js"></script>
</body>
</html>
