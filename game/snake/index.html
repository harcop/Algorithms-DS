<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="../ui.css">
</head>
<body class="game-snake">
    <main class="app">
        <header class="topbar">
            <a class="menu" href="../index.html" aria-label="All games">☰</a>
            <div class="pill">Snake</div>
            <div class="pill">★ <strong id="score">0</strong></div>
        </header>
        <section class="shell">
            <div class="shell-tools">
                <button id="restart" class="orb" type="button" aria-label="Restart">↺</button>
            </div>
            <div class="play">
                <p id="status" class="bubble">Arrow keys to turn.</p>
                <div class="stage"><canvas id="board" width="400" height="400"></canvas></div>
            </div>
            <p class="caption">Eat the food. Avoid walls and your tail.</p>
        </section>
    </main>
    <script src="./snake.js"></script>
</body>
</html>
